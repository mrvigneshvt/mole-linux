name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu checks and honeypot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Format, lint, and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build release binary for honeypot
        run: cargo build --release

      - name: Run every Arch honeypot scenario
        run: |
          shopt -s nullglob
          scenarios=(tests/honeypot/scenarios/*.sh)
          if [[ ${#scenarios[@]} -eq 0 ]]; then
            echo "No honeypot scenarios found" >&2
            exit 1
          fi
          for scenario_file in "${scenarios[@]}"; do
            scenario=${scenario_file##*/}
            scenario=${scenario%.sh}
            tests/honeypot/docker/run.sh "$scenario"
          done

  arch:
    name: Arch checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run checks in Arch Linux
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euc '
              pacman -Syu --noconfirm --needed rust cargo git
              cargo fmt --all -- --check
              cargo clippy --all-targets -- -D warnings
              cargo test
            '
