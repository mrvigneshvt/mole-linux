name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build release binaries
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          mkdir -p dist/gnu dist/musl
          cargo build --release --target x86_64-unknown-linux-gnu
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-gnu/release/mole-linux dist/gnu/mole-linux
          cp target/x86_64-unknown-linux-musl/release/mole-linux dist/musl/mole-linux
          version=${GITHUB_REF_NAME#v}
          tar -C dist/gnu -czf "dist/mole-linux-${version}-x86_64-unknown-linux-gnu.tar.gz" mole-linux
          tar -C dist/musl -czf "dist/mole-linux-${version}-x86_64-unknown-linux-musl.tar.gz" mole-linux
          rm -r dist/gnu dist/musl
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
