[package]
name = "mole-linux"
version = "0.1.0"
edition = "2024"
description = "A Linux-first system cleanup and inspection tool"
license = "GPL-3.0-only"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29.0"
rustix = { version = "1", features = ["fs"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mole-linux"
path = "src/main.rs"
